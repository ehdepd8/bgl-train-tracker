<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>부산김해경전철 열차 종합 운용 현황판 ('ㄹ'자 직결선로)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <!-- Firebase 실시간 연동 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 구간별 행 테마 클래스 */
    .row1-style { border-color: #059669 !important; color: #065f46 !important; }
    .row2-style { border-color: #d97706 !important; color: #92400e !important; }
    .row3-style { border-color: #7c3aed !important; color: #5b21b6 !important; }

    /* 기지/주박지 전용 강조 클래스 */
    .depot-badge {
      background-color: #fef3c7 !important;
      border-color: #d97706 !important;
      color: #78350f !important;
      box-shadow: 0 1px 3px rgba(217, 119, 6, 0.25) !important;
    }

    /* 열차 카드 (터치 최적화) */
    .train-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: grab;
      width: 94px;
      flex-shrink: 0;
      z-index: 30;
      touch-action: pan-x pan-y;
    }
    .train-card:active {
      cursor: grabbing;
      transform: scale(0.96);
    }
    .train-card.dragging {
      opacity: 0.45;
      transform: scale(1.05);
    }

    /* 드롭존 하이라이트 */
    .station-dropzone.drag-over {
      background-color: #fdf2f8 !important;
      border-color: #db2777 !important;
      transform: scale(1.02);
      box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.35);
    }

    /* 뷰포트 줌 래퍼 */
    #zoom-wrapper {
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
    }

    .scroll-container {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      border: 1px solid #334155;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col p-3">

  <!-- 토스트 알림 -->
  <div id="toast">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">저장되었습니다.</span>
  </div>

  <!-- 상단 컨트롤 헤더 -->
  <header class="bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-xs flex flex-wrap items-center justify-between gap-3 sticky top-1 z-50 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#832569] to-[#b8328f] flex items-center justify-center text-white shadow-xs">
        <i class="fa-solid fa-train-subway text-sm"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold text-slate-900 tracking-tight">부산김해경전철 열차 종합 운용 현황판</h1>
          <span id="sync-status" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> 실시간 공유 연결됨
          </span>
        </div>
      </div>
      
      <!-- 1/2/3관리역 범례 가이드 -->
      <div class="flex items-center gap-3 text-[11px] font-bold border-l border-slate-200 pl-3">
        <span class="flex items-center gap-1 text-emerald-700"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>1관리역</span>
        <span class="flex items-center gap-1 text-amber-700"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>2관리역</span>
        <span class="flex items-center gap-1 text-purple-700"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>3관리역</span>
        <span class="flex items-center gap-1 text-amber-900 bg-amber-100 px-1.5 py-0.5 rounded border border-amber-300"><i class="fa-solid fa-warehouse text-[10px]"></i> 주박지/기지</span>
      </div>
    </div>

    <!-- 기능 버튼 -->
    <div class="flex items-center gap-1.5 text-xs">
      <button id="btn-zoom-reset" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium border border-slate-300 transition flex items-center gap-1" title="화면 크기 100% 원복">
        <i class="fa-solid fa-magnifying-glass text-[11px]"></i> <span id="zoom-text">100%</span>
      </button>
      <button id="btn-return-all" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-md font-medium shadow-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-warehouse text-[11px]"></i> 대기소 복귀
      </button>
      <button id="btn-reset-names" class="px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md font-medium transition flex items-center gap-1">
        <i class="fa-solid fa-rotate-left text-[11px]"></i> 텍스트 초기화
      </button>
      <div class="h-5 w-px bg-slate-200 mx-1"></div>
      <button id="btn-export-slide" class="px-3 py-1.5 bg-[#832569] hover:bg-[#6c1c54] text-white rounded-md font-semibold shadow-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-image text-[11px]"></i> 슬라이드용 PNG 저장
      </button>
    </div>
  </header>

  <!-- 1. 열차 대기소 -->
  <section class="bg-white rounded-xl p-3 shadow-xs border border-slate-200 mb-3">
    <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <h2 class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-cubes-stacked text-purple-700"></i>
          편성 대기소 (1편성 ~ 25편성)
        </h2>
        <span id="depot-count" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-semibold">25편성 대기중</span>
      </div>
      <div class="text-[11px] text-slate-400">
        💡 열차를 옮기거나 이름을 입력하면 접속한 모든 기기에서 즉시 함께 변경됩니다.
      </div>
    </div>

    <!-- 대기소 드롭존 -->
    <div id="train-dock" class="station-dropzone min-h-[92px] p-2 rounded-lg bg-slate-50 border-2 border-dashed border-slate-300 flex flex-wrap gap-1.5 items-start justify-start" data-location="dock"></div>
  </section>

  <!-- 2. 메인 단일 연속 'ㄹ'자 궤도망 영역 -->
  <div class="scroll-container w-full rounded-xl" id="scroll-container">
    <div id="zoom-wrapper">
      <main class="bg-white rounded-xl p-4 shadow-xs border border-slate-200 flex flex-col relative min-w-[1350px]" id="capture-area">
        
        <!-- SVG 완전 단일 연속 레일 궤도 -->
        <svg id="continuous-rail-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0">
          <path id="svg-rail-ties" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linecap="round" stroke-dasharray="3, 11" opacity="0.65" />
          <path id="svg-rail-outer" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />
          <path id="svg-rail-row1" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-curve1" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-row2" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-curve2" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-row3" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" />
        </svg>

        <!-- [1행: 정방향 좌->우] 사상주박지 ~ 등구 ➔ 등구~대저 본선 (1관리역) -->
        <div class="relative z-10 flex items-center mb-6" id="row-1">
          <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1">
            <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
            <span class="text-[9px] font-bold text-slate-400">선로</span>
            <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
          </div>
          <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-1"></div>
        </div>

        <!-- [2행: 역방향 우->좌] 시청~부원 본선 ➔ 김해시청 ~ 대저 (2관리역) -->
        <div class="relative z-10 flex items-center mb-6" id="row-2">
          <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1">
            <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
            <span class="text-[9px] font-bold text-slate-400">선로</span>
            <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
          </div>
          <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-2"></div>
        </div>

        <!-- [3행: 정방향 좌->우] 부원 ~ 신명차량기지 (3관리역) -->
        <div class="relative z-10 flex items-center pb-1" id="row-3">
          <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1">
            <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
            <span class="text-[9px] font-bold text-slate-400">선로</span>
            <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
          </div>
          <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-3"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    /* ========================================================
       0. 사용자 전용 Firebase 설정 (완전 자동 연동)
    ======================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyAAwqYosNUTYmda3UCrEwDMJFxKK-m9Wew",
      authDomain: "bgl-train-tracker-e32b6.firebaseapp.com",
      databaseURL: "https://bgl-train-tracker-e32b6-default-rtdb.firebaseio.com",
      projectId: "bgl-train-tracker-e32b6",
      storageBucket: "bgl-train-tracker-e32b6.firebasestorage.app",
      messagingSenderId: "551417141815",
      appId: "1:551417141815:web:7ab03c5840cc28bc5f3db2"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('bgl_train_tracker_state');

    /* ========================================================
       1. 노선 데이터 정의
    ======================================================== */
    const tier1Stations = [
      { id: 'st_yard', num: '주박', name: '사상주박', isDepot: true, tier: 1 },
      { id: 'st_01', num: '01', name: '사상', transfer: '2호선', tier: 1 },
      { id: 'st_02', num: '02', name: '괘법', tier: 1 },
      { id: 'st_03', num: '03', name: '서부산', tier: 1 },
      { id: 'st_04', num: '04', name: '공항', transfer: '공항', tier: 1 },
      { id: 'st_05', num: '05', name: '덕두', tier: 1 },
      { id: 'st_06', num: '06', name: '등구', tier: 1 },
      { id: 'sec_06_07', name: '등구~대저', isConnector: true, tier: 1 }
    ];

    const tier2Stations = [
      { id: 'sec_14_15', name: '시청~부원', isConnector: true, tier: 2 },
      { id: 'st_14', num: '14', name: '김해시청', tier: 2 },
      { id: 'st_13', num: '13', name: '인제대', tier: 2 },
      { id: 'st_12', num: '12', name: '김해대학', tier: 2 },
      { id: 'st_11', num: '11', name: '지내', tier: 2 },
      { id: 'st_10', num: '10', name: '불암', tier: 2 },
      { id: 'st_09', num: '09', name: '대사', tier: 2 },
      { id: 'st_08', num: '08', name: '평강', tier: 2 },
      { id: 'st_07', num: '07', name: '대저', transfer: '3호선', tier: 2 }
    ];

    const tier3Stations = [
      { id: 'st_15', num: '15', name: '부원', tier: 3 },
      { id: 'st_16', num: '16', name: '봉황', tier: 3 },
      { id: 'st_17', num: '17', name: '수로왕릉', tier: 3 },
      { id: 'st_18', num: '18', name: '박물관', tier: 3 },
      { id: 'st_19', num: '19', name: '연지공원', tier: 3 },
      { id: 'st_20', num: '20', name: '장신대', tier: 3 },
      { id: 'st_21', num: '21', name: '가야대', tier: 3 },
      { id: 'st_depot', num: '기지', name: '신명기지', isDepot: true, tier: 3 }
    ];

    let trainsData = {};
    for (let i = 1; i <= 25; i++) {
      const trainId = `train_${i}`;
      trainsData[trainId] = {
        id: trainId,
        num: i,
        numStr: String(i).padStart(2, '0') + '편성',
        label: '',
        location: 'dock'
      };
    }

    const STORAGE_KEY = 'BGL_TRAIN_TRACKER_STATE_REAL_S';

    // 클라우드 저장
    function syncToCloud() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trainsData));
      dbRef.set(trainsData);
    }

    // 실시간 클라우드 감지 리스너
    function initRealtimeSync() {
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          trainsData = { ...trainsData, ...val };
          renderAllTrains();
        } else {
          // 최초 실행 시 기본값 등록
          dbRef.set(trainsData);
        }
      });
    }

    /* ========================================================
       2. UI 렌더링 템플릿
    ======================================================== */
    function createTrainCardHTML(train) {
      return `
        <div id="${train.id}" 
             class="train-card flex flex-col bg-white border border-slate-300 rounded shadow-xs overflow-hidden select-none"
             draggable="true">
          
          <div class="bg-gradient-to-r from-[#7a2665] via-[#8c2670] to-[#7a2665] px-1 py-0.5 flex items-center justify-center text-white border-b border-purple-900 pointer-events-none">
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-train-subway text-[10px] text-purple-200"></i>
              <span class="text-[12px] font-semibold tracking-tight text-white leading-none">${train.numStr}</span>
            </div>
          </div>

          <div class="bg-slate-100 px-1 py-0.5 border-b border-slate-200 flex items-center justify-center pointer-events-none">
            <div class="flex gap-1 items-center">
              <div class="w-2 h-1 bg-slate-700 rounded-xs"></div>
              <div class="w-3.5 h-1 bg-sky-200 border border-slate-400 rounded-xs"></div>
              <div class="w-3.5 h-1 bg-sky-200 border border-slate-400 rounded-xs"></div>
              <div class="w-2 h-1 bg-slate-700 rounded-xs"></div>
            </div>
          </div>

          <div class="p-0.5 bg-white">
            <input type="text" 
                   value="${escapeHtml(train.label)}" 
                   placeholder="이름" 
                   class="train-label-input w-full text-center text-[10px] font-semibold px-1 py-0.5 bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 focus:border-purple-600 rounded text-slate-800 focus:outline-hidden transition leading-tight"
                   data-train-id="${train.id}" />
          </div>
        </div>
      `;
    }

    function renderTrackLine(containerId, list) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      list.forEach((st, idx) => {
        const col = document.createElement('div');
        const isConn = st.isConnector;

        const colWidth = isConn ? 'flex-[0.75] max-w-[88px] min-w-[72px]' : 'flex-1 max-w-[104px] min-w-[84px]';
        col.className = `flex flex-col justify-between items-center h-[190px] px-0.5 z-10 ${colWidth}`;
        
        let rowClass = `row${st.tier}-style`;
        let dotColor = st.tier === 1 ? '#059669' : (st.tier === 2 ? '#d97706' : '#7c3aed');
        
        let badgeStyle = `bg-white text-slate-900 border-2 ${rowClass}`;

        if (st.isDepot) {
          badgeStyle = 'depot-badge border-2';
          dotColor = '#d97706';
        } else if (isConn) {
          badgeStyle = 'bg-white/85 text-slate-400 border-slate-300';
        }
        
        const upBg = isConn 
          ? 'bg-sky-50/40 border border-dashed border-sky-200' 
          : (st.isDepot ? 'bg-amber-50/50 border border-amber-300' : 'bg-sky-50/80 border border-sky-200');
          
        const dnBg = isConn 
          ? 'bg-rose-50/40 border border-dashed border-rose-200' 
          : (st.isDepot ? 'bg-amber-50/50 border border-amber-300' : 'bg-rose-50/80 border border-rose-200');

        col.innerHTML = `
          <!-- 상선 슬롯 -->
          <div class="station-dropzone w-full h-[76px] rounded-lg ${upBg} flex items-center justify-center p-0.5 shadow-2xs backdrop-blur-xs" data-location="${st.id}_UP" title="${st.name} 상선"></div>
          
          <!-- 슬림 명판 -->
          <div class="station-mid-marker relative z-20 w-full h-[20px] rounded ${badgeStyle} flex items-center justify-center shadow-xs px-1 gap-1" data-marker="${st.id}">
            ${st.num ? `<span class="w-3 h-3 rounded-full text-white text-[7px] font-black flex items-center justify-center shadow-xs" style="background-color: ${dotColor};">${st.num}</span>` : ''}
            <span class="${isConn ? 'text-[8.5px] font-bold text-slate-400' : 'text-[9.5px] font-extrabold'} truncate leading-none">${st.name}</span>
            ${st.transfer ? `<span class="text-[7.5px] bg-sky-100 text-sky-800 font-bold px-0.5 rounded leading-tight">${st.transfer}</span>` : ''}
          </div>

          <!-- 하선 슬롯 -->
          <div class="station-dropzone w-full h-[76px] rounded-lg ${dnBg} flex items-center justify-center p-0.5 shadow-2xs backdrop-blur-xs" data-location="${st.id}_DN" title="${st.name} 하선"></div>
        `;
        container.appendChild(col);

        // 일반 역간 본선 구간
        if (idx < list.length - 1 && !isConn && !list[idx + 1].isConnector) {
          const nextSt = list[idx + 1];
          const sec = document.createElement('div');
          sec.className = 'flex flex-col justify-between items-center h-[190px] flex-[0.75] px-0.5 z-10 max-w-[88px] min-w-[72px]';
          sec.innerHTML = `
            <!-- 본선 상선 -->
            <div class="station-dropzone w-full h-[76px] rounded-lg bg-sky-50/40 border border-dashed border-sky-200 flex items-center justify-center p-0.5 shadow-2xs" data-location="SEC_${st.id}_${nextSt.id}_UP" title="${st.name}~${nextSt.name} 본선 상선"></div>
            
            <!-- 본선 표기 -->
            <div class="station-mid-marker relative z-20 w-full h-[20px] rounded bg-white/85 border border-slate-300 flex items-center justify-center shadow-xs" data-marker="SEC_${st.id}_${nextSt.id}">
              <span class="text-[8.5px] font-bold text-slate-400">본선</span>
            </div>

            <!-- 본선 하선 -->
            <div class="station-dropzone w-full h-[76px] rounded-lg bg-rose-50/40 border border-dashed border-rose-200 flex items-center justify-center p-0.5 shadow-2xs" data-location="SEC_${st.id}_${nextSt.id}_DN" title="${st.name}~${nextSt.name} 본선 하선"></div>
          `;
          container.appendChild(sec);
        }
      });
    }

    /* ========================================================
       3. 물리적 직결 'ㄹ'자 SVG 단일 궤도
    ======================================================== */
    function drawContinuousRail() {
      const captureArea = document.getElementById('capture-area');
      const captureRect = captureArea.getBoundingClientRect();

      const r1StartMarker = document.querySelector('[data-marker="st_yard"]');
      const r1ConnMarker = document.querySelector('[data-marker="sec_06_07"]');

      const r2DaejeMarker = document.querySelector('[data-marker="st_07"]');
      const r2ConnMarker = document.querySelector('[data-marker="sec_14_15"]');

      const r3StartMarker = document.querySelector('[data-marker="st_15"]');
      const r3EndMarker = document.querySelector('[data-marker="st_depot"]');

      if (!r1StartMarker || !r1ConnMarker || !r2ConnMarker || !r2DaejeMarker || !r3StartMarker || !r3EndMarker) return;

      const getCenter = (el) => {
        const r = el.getBoundingClientRect();
        return {
          x: (r.left + r.width / 2 - captureRect.left) / currentScale,
          y: (r.top + r.height / 2 - captureRect.top) / currentScale
        };
      };

      const pR1Start = getCenter(r1StartMarker);
      const pR1Conn = getCenter(r1ConnMarker);
      const pR2Daeje = getCenter(r2DaejeMarker);
      const pR2Conn = getCenter(r2ConnMarker);
      const pR3Start = getCenter(r3StartMarker);
      const pR3End = getCenter(r3EndMarker);

      const rightCurveX = Math.max(pR1Conn.x, pR2Daeje.x) + 48;
      const leftCurveX = Math.min(pR2Conn.x, pR3Start.x) - 48;

      const fullPath = `
        M ${pR1Start.x - 12} ${pR1Start.y}
        L ${pR1Conn.x} ${pR1Conn.y}
        C ${rightCurveX} ${pR1Conn.y}, ${rightCurveX} ${pR2Daeje.y}, ${pR2Daeje.x} ${pR2Daeje.y}
        L ${pR2Conn.x} ${pR2Conn.y}
        C ${leftCurveX} ${pR2Conn.y}, ${leftCurveX} ${pR3Start.y}, ${pR3Start.x} ${pR3Start.y}
        L ${pR3End.x + 12} ${pR3End.y}
      `;
      document.getElementById('svg-rail-ties').setAttribute('d', fullPath);
      document.getElementById('svg-rail-outer').setAttribute('d', fullPath);

      document.getElementById('svg-rail-row1').setAttribute('d', `M ${pR1Start.x - 12} ${pR1Start.y} L ${pR1Conn.x} ${pR1Conn.y}`);
      document.getElementById('svg-rail-curve1').setAttribute('d', `M ${pR1Conn.x} ${pR1Conn.y} C ${rightCurveX} ${pR1Conn.y}, ${rightCurveX} ${pR2Daeje.y}, ${pR2Daeje.x} ${pR2Daeje.y}`);
      document.getElementById('svg-rail-row2').setAttribute('d', `M ${pR2Daeje.x} ${pR2Daeje.y} L ${pR2Conn.x} ${pR2Conn.y}`);
      document.getElementById('svg-rail-curve2').setAttribute('d', `M ${pR2Conn.x} ${pR2Conn.y} C ${leftCurveX} ${pR2Conn.y}, ${leftCurveX} ${pR3Start.y}, ${pR3Start.x} ${pR3Start.y}`);
      document.getElementById('svg-rail-row3').setAttribute('d', `M ${pR3Start.x} ${pR3Start.y} L ${pR3End.x + 12} ${pR3End.y}`);
    }

    function renderAllTrains() {
      const activeInput = document.activeElement;
      const activeTrainId = activeInput && activeInput.classList.contains('train-label-input') 
                            ? activeInput.dataset.trainId : null;

      document.querySelectorAll('.station-dropzone').forEach(zone => {
        zone.querySelectorAll('.train-card').forEach(c => c.remove());
      });

      let dockCount = 0;

      Object.values(trainsData).forEach(train => {
        const targetZone = document.querySelector(`.station-dropzone[data-location="${train.location}"]`) 
                           || document.getElementById('train-dock');

        if (train.location === 'dock') {
          dockCount++;
        }

        const tempWrap = document.createElement('div');
        tempWrap.innerHTML = createTrainCardHTML(train);
        const cardElem = tempWrap.firstElementChild;
        targetZone.appendChild(cardElem);
      });

      const countLabel = document.getElementById('depot-count');
      if (countLabel) countLabel.textContent = `${dockCount}편성 대기중`;

      if (activeTrainId) {
        const restoredInput = document.querySelector(`input[data-train-id="${activeTrainId}"]`);
        if (restoredInput) restoredInput.focus();
      }

      attachTrainEvents();
    }

    /* ========================================================
       4. 드래그 엣지 감지 자동 스크롤 엔진
    ======================================================== */
    let autoScrollSpeedX = 0;
    let autoScrollSpeedY = 0;
    let autoScrollRaf = null;

    function handleAutoScroll(clientX, clientY) {
      const scrollContainer = document.getElementById('scroll-container');
      const edgeThreshold = 75;
      const maxSpeed = 16;

      const windowHeight = window.innerHeight;
      if (clientY > windowHeight - edgeThreshold) {
        const ratio = (clientY - (windowHeight - edgeThreshold)) / edgeThreshold;
        autoScrollSpeedY = Math.min(maxSpeed, Math.max(3, ratio * maxSpeed));
      } else if (clientY < edgeThreshold + 60) {
        const ratio = ((edgeThreshold + 60) - clientY) / edgeThreshold;
        autoScrollSpeedY = -Math.min(maxSpeed, Math.max(3, ratio * maxSpeed));
      } else {
        autoScrollSpeedY = 0;
      }

      const cRect = scrollContainer.getBoundingClientRect();
      if (clientX > cRect.right - edgeThreshold) {
        const ratio = (clientX - (cRect.right - edgeThreshold)) / edgeThreshold;
        autoScrollSpeedX = Math.min(maxSpeed, Math.max(3, ratio * maxSpeed));
      } else if (clientX < cRect.left + edgeThreshold) {
        const ratio = ((cRect.left + edgeThreshold) - clientX) / edgeThreshold;
        autoScrollSpeedX = -Math.min(maxSpeed, Math.max(3, ratio * maxSpeed));
      } else {
        autoScrollSpeedX = 0;
      }

      if ((autoScrollSpeedX !== 0 || autoScrollSpeedY !== 0) && !autoScrollRaf) {
        autoScrollLoop();
      }
    }

    function autoScrollLoop() {
      if (autoScrollSpeedX !== 0 || autoScrollSpeedY !== 0) {
        const scrollContainer = document.getElementById('scroll-container');
        if (autoScrollSpeedY !== 0) window.scrollBy(0, autoScrollSpeedY);
        if (autoScrollSpeedX !== 0) scrollContainer.scrollLeft += autoScrollSpeedX;
        autoScrollRaf = requestAnimationFrame(autoScrollLoop);
      } else {
        cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = null;
      }
    }

    function stopAutoScroll() {
      autoScrollSpeedX = 0;
      autoScrollSpeedY = 0;
      if (autoScrollRaf) {
        cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = null;
      }
    }

    /* ========================================================
       5. 드래그 앤 드롭 & 두 손가락 핀치 줌 로직
    ======================================================== */
    let draggedTrainId = null;
    let touchDraggingCard = null;
    let touchClone = null;
    let touchOffsetX = 0;
    let touchOffsetY = 0;
    let touchTimer = null;
    let isDragMode = false;

    let currentScale = 1.0;
    let initialPinchDist = 0;
    let startScale = 1.0;

    const zoomWrapper = document.getElementById('zoom-wrapper');
    const scrollContainer = document.getElementById('scroll-container');
    const zoomText = document.getElementById('zoom-text');

    function setScale(scale) {
      currentScale = Math.min(Math.max(scale, 0.5), 2.5);
      zoomWrapper.style.transform = `scale(${currentScale})`;
      zoomText.textContent = `${Math.round(currentScale * 100)}%`;
      drawContinuousRail();
    }

    document.getElementById('btn-zoom-reset').addEventListener('click', () => {
      setScale(1.0);
    });

    function getDistance(touches) {
      return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
    }

    scrollContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        clearTimeout(touchTimer);
        isDragMode = false;
        stopAutoScroll();
        if (touchClone) { touchClone.remove(); touchClone = null; }
        if (touchDraggingCard) { touchDraggingCard.classList.remove('dragging'); touchDraggingCard = null; }
        
        initialPinchDist = getDistance(e.touches);
        startScale = currentScale;
      }
    }, { passive: false });

    scrollContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = getDistance(e.touches);
        if (initialPinchDist > 0) {
          const factor = dist / initialPinchDist;
          setScale(startScale * factor);
        }
      }
    }, { passive: false });

    scrollContainer.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = 0;
    });

    function attachTrainEvents() {
      document.querySelectorAll('.train-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          draggedTrainId = card.id;
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', card.id);
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('drag', (e) => {
          if (e.clientX !== 0 || e.clientY !== 0) {
            handleAutoScroll(e.clientX, e.clientY);
          }
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedTrainId = null;
          stopAutoScroll();
          document.querySelectorAll('.station-dropzone').forEach(z => z.classList.remove('drag-over'));
        });

        card.addEventListener('touchstart', (e) => {
          if (e.target.tagName.toLowerCase() === 'input' || e.touches.length > 1) return;
          const touch = e.touches[0];
          isDragMode = false;

          const startX = touch.clientX;
          const startY = touch.clientY;

          touchTimer = setTimeout(() => {
            isDragMode = true;
            touchDraggingCard = card;
            draggedTrainId = card.id;

            const rect = card.getBoundingClientRect();
            touchOffsetX = startX - rect.left;
            touchOffsetY = startY - rect.top;

            touchClone = card.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.zIndex = '9999';
            touchClone.style.opacity = '0.9';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.transform = `scale(${currentScale * 1.05})`;
            touchClone.style.left = `${rect.left}px`;
            touchClone.style.top = `${rect.top}px`;
            document.body.appendChild(touchClone);

            card.classList.add('dragging');
          }, 140);
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          if (e.touches.length > 1) {
            clearTimeout(touchTimer);
            stopAutoScroll();
            return;
          }
          if (!isDragMode) {
            clearTimeout(touchTimer);
            return;
          }
          e.preventDefault();
          const touch = e.touches[0];
          if (touchClone) {
            touchClone.style.left = `${touch.clientX - touchOffsetX}px`;
            touchClone.style.top = `${touch.clientY - touchOffsetY}px`;
          }

          handleAutoScroll(touch.clientX, touch.clientY);

          const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
          const dropZone = elemBelow ? elemBelow.closest('.station-dropzone') : null;

          document.querySelectorAll('.station-dropzone').forEach(z => z.classList.remove('drag-over'));
          if (dropZone) dropZone.classList.add('drag-over');
        }, { passive: false });

        card.addEventListener('touchend', (e) => {
          clearTimeout(touchTimer);
          stopAutoScroll();
          if (!isDragMode) return;

          const touch = e.changedTouches[0];
          const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
          const dropZone = elemBelow ? elemBelow.closest('.station-dropzone') : null;

          if (dropZone && trainsData[draggedTrainId]) {
            trainsData[draggedTrainId].location = dropZone.dataset.location;
            syncToCloud();
            showToast('실시간 위치가 공유되었습니다.');
          }

          if (touchClone) { touchClone.remove(); touchClone = null; }
          if (touchDraggingCard) { touchDraggingCard.classList.remove('dragging'); touchDraggingCard = null; }
          draggedTrainId = null;
          isDragMode = false;
          document.querySelectorAll('.station-dropzone').forEach(z => z.classList.remove('drag-over'));
        });

        card.addEventListener('touchcancel', () => {
          clearTimeout(touchTimer);
          stopAutoScroll();
          if (touchClone) { touchClone.remove(); touchClone = null; }
          if (touchDraggingCard) { touchDraggingCard.classList.remove('dragging'); touchDraggingCard = null; }
          isDragMode = false;
        });
      });

      document.querySelectorAll('.train-label-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const tId = e.target.dataset.trainId;
          if (trainsData[tId]) {
            trainsData[tId].label = e.target.value.trim();
            syncToCloud();
            showToast('편성 정보가 실시간 업데이트되었습니다.');
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') e.target.blur();
        });
      });
    }

    function initDropZones() {
      document.querySelectorAll('.station-dropzone').forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          zone.classList.add('drag-over');
          handleAutoScroll(e.clientX, e.clientY);
        });

        zone.addEventListener('dragleave', (e) => {
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove('drag-over');
          }
        });

        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          stopAutoScroll();

          const trainId = e.dataTransfer.getData('text/plain') || draggedTrainId;
          if (trainId && trainsData[trainId]) {
            trainsData[trainId].location = zone.dataset.location;
            syncToCloud();
            showToast('실시간 위치가 공유되었습니다.');
          }
        });
      });
    }

    /* ========================================================
       6. 컨트롤 버튼 동작
    ======================================================== */
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgSpan = document.getElementById('toast-message');
      msgSpan.textContent = msg;

      if (toastTimeout) clearTimeout(toastTimeout);
      toast.classList.add('show');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    document.getElementById('btn-return-all').addEventListener('click', () => {
      if (confirm('모든 편성을 대기소로 복귀시키겠습니까?\n(접속된 모든 기기에서 즉시 복귀됩니다)')) {
        Object.keys(trainsData).forEach(id => { trainsData[id].location = 'dock'; });
        syncToCloud();
        showToast('전체 편성이 대기소로 복귀되었습니다.');
      }
    });

    document.getElementById('btn-reset-names').addEventListener('click', () => {
      if (confirm('모든 열차에 작성된 메모/이름을 초기화하시겠습니까?\n(접속된 모든 기기에 반영됩니다)')) {
        Object.keys(trainsData).forEach(id => { trainsData[id].label = ''; });
        syncToCloud();
        showToast('텍스트가 초기화되었습니다.');
      }
    });

    // 슬라이드 삽입용 고화질 전체 캡처
    document.getElementById('btn-export-slide').addEventListener('click', async () => {
      const captureElem = document.getElementById('capture-area');
      const btn = document.getElementById('btn-export-slide');
      const originText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> 생성 중...';

      const savedScale = currentScale;
      zoomWrapper.style.transform = 'scale(1)';

      try {
        const canvas = await html2canvas(captureElem, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        });

        const link = document.createElement('a');
        link.download = `부산김해경전철_노선운용현황_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('슬라이드용 고화질 이미지가 다운로드되었습니다!');
      } catch (err) {
        console.error(err);
        alert('이미지 생성 중 오류가 발생했습니다.');
      } finally {
        zoomWrapper.style.transform = `scale(${savedScale})`;
        btn.innerHTML = originText;
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* 초기 실행 */
    window.addEventListener('DOMContentLoaded', () => {
      renderTrackLine('track-tier-1', tier1Stations);
      renderTrackLine('track-tier-2', tier2Stations);
      renderTrackLine('track-tier-3', tier3Stations);
      initDropZones();
      
      initRealtimeSync();

      setTimeout(drawContinuousRail, 200);
    });

    window.addEventListener('resize', drawContinuousRail);
  </script>
