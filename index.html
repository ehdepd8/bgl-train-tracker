<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>열차 종합 현황판 ('ㄹ'자 직결선로)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Pretendard Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <!-- Firebase 실시간 연동 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 관리역별 고유 테마 클래스 */
    .row1-style { border-color: #059669 !important; color: #065f46 !important; }
    .row2-style { border-color: #d97706 !important; color: #92400e !important; }
    .row3-style { border-color: #7c3aed !important; color: #5b21b6 !important; }

    /* 기지/주박지 전용 강조 클래스 */
    .depot-badge {
      background-color: #fef3c7 !important;
      border-color: #d97706 !important;
      color: #78350f !important;
      box-shadow: 0 1px 3px rgba(217, 119, 6, 0.25) !important;
    }

    /* 열차 카드 (터치 최적화) */
    .train-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: grab;
      width: 94px;
      flex-shrink: 0;
      z-index: 30;
      touch-action: pan-x pan-y;
    }
    .train-card:active {
      cursor: grabbing;
      transform: scale(0.96);
    }
    .train-card.dragging {
      opacity: 0.45;
      transform: scale(1.05);
    }

    /* 드롭존 하이라이트 */
    .station-dropzone.drag-over {
      background-color: #fdf2f8 !important;
      border-color: #db2777 !important;
      transform: scale(1.02);
      box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.35);
    }

    /* 뷰포트 줌 래퍼 */
    #zoom-wrapper {
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
    }

    .scroll-container {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* WCU 경계 본선 관통 점선 */
    .wcu-boundary-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      transform: translateX(-50%);
      border-left: 2px dashed #94a3b8;
      pointer-events: none;
      z-index: 25;
      opacity: 0.75;
    }

    /* 선택 제외 영역 음영(Dim) 처리 */
    .wcu-dimmed {
      opacity: 0.22 !important;
      filter: grayscale(85%) !important;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }

    /* WCU 프리셋 활성화 버튼 스타일 */
    .wcu-btn.active {
      background-color: #832569 !important;
      color: #ffffff !important;
      border-color: #832569 !important;
      font-weight: 800 !important;
      box-shadow: 0 2px 6px rgba(131, 37, 105, 0.35) !important;
    }

    /* 수동 드래그 모드 활성화 시 트랙 컬럼에 마우스 포인터 표시 */
    body.manual-drag-mode [data-track-col] {
      cursor: pointer !important;
    }
    body.manual-drag-mode [data-track-col]:hover {
      outline: 2px dashed #f59e0b;
      outline-offset: -2px;
    }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      border: 1px solid #334155;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col p-3">

  <!-- 토스트 알림 -->
  <div id="toast">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">저장되었습니다.</span>
  </div>

  <!-- 상단 컨트롤 헤더 -->
  <header class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 shadow-xs flex flex-col gap-2 mb-3">
    <!-- 헤더 1행: 타이틀 및 기능 버튼 -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#832569] to-[#b8328f] flex items-center justify-center text-white shadow-xs">
          <i class="fa-solid fa-train-subway text-sm"></i>
        </div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold text-slate-900 tracking-tight">열차 종합 현황판</h1>
          <span id="sync-status" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> 실시간
          </span>
        </div>
      </div>

      <!-- 우측 컨트롤 버튼 -->
      <div class="flex items-center gap-1.5 text-xs">
        <button id="btn-zoom-reset" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium border border-slate-300 transition flex items-center gap-1">
          <i class="fa-solid fa-magnifying-glass text-[11px]"></i> <span id="zoom-text">100%</span>
        </button>
        <button id="btn-return-all" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-md font-medium shadow-xs flex items-center gap-1 transition">
          <i class="fa-solid fa-warehouse text-[11px]"></i> 대기소 복귀
        </button>
        <button id="btn-reset-names" class="px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-left text-[11px]"></i> 텍스트 초기화
        </button>
      </div>
    </div>

    <!-- 헤더 2행: WCU 프리셋 및 자유 구간 드래그 선택 모드 -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="text-[11px] font-extrabold text-slate-500 mr-1 flex items-center gap-1">
          <i class="fa-solid fa-filter text-purple-700"></i> WCU 선택:
        </span>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="1">WCU 1</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="2">WCU 2</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="3">WCU 3</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="4">WCU 4</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="5">WCU 5</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="6">WCU 6</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="7">WCU 7</button>
        <button type="button" class="wcu-btn px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 border border-slate-300 text-[11px] font-semibold text-slate-700 transition" data-wcu="8">WCU 8</button>
        <button type="button" id="btn-wcu-clear" class="px-2 py-1 rounded bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 text-[11px] font-bold transition ml-1">전체해제</button>
        
        <div class="h-4 w-px bg-slate-200 mx-1"></div>
        
        <!-- 자유 드래그 모드 버튼 -->
        <button type="button" id="btn-toggle-drag-mode" class="px-2.5 py-1 rounded border border-amber-400 bg-amber-50 hover:bg-amber-100 text-amber-800 text-[11px] font-bold transition flex items-center gap-1 shadow-2xs">
          <i class="fa-solid fa-arrows-left-right-to-line"></i> <span id="drag-mode-text">구간 직접 드래그/선택</span>
        </button>
      </div>

      <!-- 선택된 구간 표기문구 입력창 -->
      <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2 py-1 rounded-md">
        <label for="wcu-memo-input" class="text-[11px] font-bold text-slate-600">구간 표기문구:</label>
        <input type="text" id="wcu-memo-input" placeholder="예: 순환승차, 신호점검" class="px-2 py-0.5 rounded border border-slate-300 text-[11px] bg-white focus:outline-hidden focus:border-purple-600 w-36 transition font-semibold" />
        <button type="button" id="btn-wcu-apply-text" class="px-2.5 py-0.5 rounded bg-purple-700 hover:bg-purple-800 text-white text-[11px] font-bold transition shadow-2xs">적용</button>
      </div>
    </div>
  </header>

  <!-- 1. 열차 대기소 -->
  <section class="bg-white rounded-xl p-3 shadow-xs border border-slate-200 mb-3">
    <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <h2 class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-cubes-stacked text-purple-700"></i>
          편성 대기소 (1편성 ~ 25편성)
        </h2>
        <span id="depot-count" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-semibold">25편성 대기중</span>
      </div>
      <div class="text-[11px] text-slate-400">
        💡 열차를 옮기거나 구간을 드래그하면 접속한 모든 기기에서 즉시 함께 변경됩니다.
      </div>
    </div>

    <!-- 대기소 드롭존 -->
    <div id="train-dock" class="station-dropzone min-h-[92px] p-2 rounded-lg bg-slate-50 border-2 border-dashed border-slate-300 flex flex-wrap gap-1.5 items-start justify-start" data-location="dock"></div>
  </section>

  <!-- 2. 메인 단일 연속 'ㄹ'자 궤도망 영역 -->
  <div class="scroll-container w-full rounded-xl" id="scroll-container">
    <div id="zoom-wrapper">
      <main class="bg-white rounded-xl p-4 shadow-xs border border-slate-200 flex flex-col relative min-w-[1350px]" id="capture-area">
        
        <!-- SVG 레일 -->
        <svg id="continuous-rail-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0">
          <path id="svg-rail-ties" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linecap="round" stroke-dasharray="3, 11" opacity="0.65" />
          <path id="svg-rail-outer" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />
          
          <path id="svg-rail-row1" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-curve1" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-row2" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-curve2" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
          <path id="svg-rail-row3" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" />
        </svg>

        <!-- [1행: 정방향 좌->우] 사상주박지 ~ 등구 ➔ 등구~대저 본선 -->
        <div class="relative z-10 flex items-center mb-6" id="row-1">
          <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1 pointer-events-none">
            <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
            <span class="text-[9px] font-bold text-slate-400">선로</span>
            <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
          </div>
          <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-1"></div>
        </div>

        <!-- [2행: 역방향 우->좌] 시청~부원 본선 ➔ 김해시청 ~ 대저 -->
        <div class="relative z-10 flex items-center mb-6" id="row-2">
          <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1 pointer-events-none">
            <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
            <span class="text-[9px] font-bold text-slate-400">선로</span>
            <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
          </div>
          <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-2"></div>
        </div>

        <!-- [3행: 정방향 좌->우] 부원 ~ 신명차량기지 -->
        <div class="relative z-10 flex items-center pb-1" id="row-3">
          <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1 pointer-events-none">
            <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
            <span class="text-[9px] font-bold text-slate-400">선로</span>
            <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
          </div>
          <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-3"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    /* ========================================================
       0. Firebase 설정
    ======================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyAAwqYosNUTYmda3UCrEwDMJFxKK-m9Wew",
      authDomain: "bgl-train-tracker-e32b6.firebaseapp.com",
      databaseURL: "https://bgl-train-tracker-e32b6-default-rtdb.firebaseio.com",
      projectId: "bgl-train-tracker-e32b6",
      storageBucket: "bgl-train-tracker-e32b6.firebasestorage.app",
      messagingSenderId: "551417141815",
      appId: "1:551417141815:web:7ab03c5840cc28bc5f3db2"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('bgl_train_tracker_state');
    const wcuStateRef = firebase.database().ref('bgl_wcu_filter_state_v3');

    /* ========================================================
       1. 노선 데이터 정의 (전체 선로 순서 1D 시퀀스 인덱싱)
    ======================================================== */
    const tier1Stations = [
      { id: 'st_yard', num: '주박', name: '사상주박', isDepot: true, tier: 1, wcu: 1 },
      { id: 'st_01', num: '01', name: '사상', transfer: '2호선', tier: 1, wcu: 1 },
      { id: 'st_02', num: '02', name: '괘법', tier: 1, wcu: 1 },
      { id: 'st_03', num: '03', name: '서부산', tier: 1, wcu: 2 },
      { id: 'st_04', num: '04', name: '공항', transfer: '공항', tier: 1, wcu: 2 },
      { id: 'st_05', num: '05', name: '덕두', tier: 1, wcu: 2 },
      { id: 'st_06', num: '06', name: '등구', tier: 1, wcu: 3 },
      { id: 'sec_06_07', name: '등구~대저', isConnector: true, tier: 1, wcu: 3 }
    ];

    const tier2Stations = [
      { id: 'sec_14_15', name: '시청~부원', isConnector: true, tier: 2, wcu: 6 },
      { id: 'st_14', num: '14', name: '김해시청', tier: 2, wcu: 6 },
      { id: 'st_13', num: '13', name: '인제대', tier: 2, wcu: 6 },
      { id: 'st_12', num: '12', name: '김해대학', tier: 2, wcu: 5 },
      { id: 'st_11', num: '11', name: '지내', tier: 2, wcu: 5 },
      { id: 'st_10', num: '10', name: '불암', tier: 2, wcu: 4 },
      { id: 'st_09', num: '09', name: '대사', tier: 2, wcu: 4 },
      { id: 'st_08', num: '08', name: '평강', tier: 2, wcu: 3 },
      { id: 'st_07', num: '07', name: '대저', transfer: '3호선', tier: 2, wcu: 3 }
    ];

    const tier3Stations = [
      { id: 'st_15', num: '15', name: '부원', tier: 3, wcu: 6 },
      { id: 'st_16', num: '16', name: '봉황', tier: 3, wcu: 7 },
      { id: 'st_17', num: '17', name: '수로왕릉', tier: 3, wcu: 7 },
      { id: 'st_18', num: '18', name: '박물관', tier: 3, wcu: 7 },
      { id: 'st_19', num: '19', name: '연지공원', tier: 3, wcu: 7 },
      { id: 'st_20', num: '20', name: '장신대', tier: 3, wcu: 8 },
      { id: 'st_21', num: '21', name: '가야대', tier: 3, wcu: 8 },
      { id: 'st_depot', num: '기지', name: '신명기지', isDepot: true, tier: 3, wcu: 8 }
    ];

    function getWcuEdgeLabels(stIdA, stIdB) {
      const pair = [stIdA, stIdB].sort().join('_');
      if (pair === 'st_02_st_03') return { left: 'WCU 1', right: 'WCU 2', leftWcu: 1, rightWcu: 2, boundary: [1, 2] };
      if (pair === 'st_05_st_06') return { left: 'WCU 2', right: 'WCU 3', leftWcu: 2, rightWcu: 3, boundary: [2, 3] };
      if (pair === 'st_08_st_09') return { left: 'WCU 4', right: 'WCU 3', leftWcu: 4, rightWcu: 3, boundary: [3, 4] };
      if (pair === 'st_10_st_11') return { left: 'WCU 5', right: 'WCU 4', leftWcu: 5, rightWcu: 4, boundary: [4, 5] };
      if (pair === 'st_12_st_13') return { left: 'WCU 6', right: 'WCU 5', leftWcu: 6, rightWcu: 5, boundary: [5, 6] };
      if (pair === 'st_15_st_16') return { left: 'WCU 6', right: 'WCU 7', leftWcu: 6, rightWcu: 7, boundary: [6, 7] };
      if (pair === 'st_19_st_20') return { left: 'WCU 7', right: 'WCU 8', leftWcu: 7, rightWcu: 8, boundary: [7, 8] };
      return null;
    }

    function getSectionWcu(stA, stB) {
      const edge = getWcuEdgeLabels(stA.id, stB.id);
      if (edge) return null;
      return stA.wcu || stB.wcu;
    }

    // 선로상의 모든 컬럼을 물리적 순환 순서대로 1차원 등록 (인덱스 부여)
    const linearTrackKeys = [];

    let trainsData = {};
    for (let i = 1; i <= 25; i++) {
      const trainId = `train_${i}`;
      trainsData[trainId] = {
        id: trainId,
        num: i,
        numStr: String(i).padStart(2, '0') + '편성',
        label: '',
        location: 'dock'
      };
    }

    // 전체 필터 상태 (WCU 프리셋 모드 + 수동 연속 구간 모드 지원)
    let filterState = {
      mode: 'wcu',          // 'wcu' | 'manual'
      selectedWcus: [],     // 예: [1, 2]
      manualStartIdx: -1,   // 수동 시작 칸 인덱스
      manualEndIdx: -1,     // 수동 끝 칸 인덱스
      memo: ''              // 표기 문구
    };

    let isManualDragActive = false; // 상단 버튼으로 켜는 자유 선택 모드 활성화 여부
    let isPointerDragging = false;
    let dragAnchorIdx = null;

    const STORAGE_KEY = 'BGL_TRAIN_TRACKER_STATE_REAL_S';

    function syncToCloud() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trainsData));
      dbRef.set(trainsData);
    }

    function syncFilterToCloud() {
      wcuStateRef.set(filterState);
    }

    function initRealtimeSync() {
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          trainsData = { ...trainsData, ...val };
          renderAllTrains();
        } else {
          dbRef.set(trainsData);
        }
      });

      wcuStateRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          filterState = {
            mode: val.mode || 'wcu',
            selectedWcus: val.selectedWcus || [],
            manualStartIdx: typeof val.manualStartIdx === 'number' ? val.manualStartIdx : -1,
            manualEndIdx: typeof val.manualEndIdx === 'number' ? val.manualEndIdx : -1,
            memo: val.memo || ''
          };
          updateFilterUI();
        }
      });
    }

    /* ========================================================
       2. UI 렌더링 및 음영/텍스트 갱신 로직
    ======================================================== */
    function updateFilterUI() {
      const memo = (filterState.memo || '').trim();
      const memoInput = document.getElementById('wcu-memo-input');
      if (memoInput && document.activeElement !== memoInput) {
        memoInput.value = memo;
      }

      // 1) WCU 프리셋 버튼 상태 표시
      document.querySelectorAll('.wcu-btn').forEach(btn => {
        const num = Number(btn.dataset.wcu);
        if (filterState.mode === 'wcu' && filterState.selectedWcus.includes(num)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 2) 자유 드래그 버튼 스타일
      const dragBtn = document.getElementById('btn-toggle-drag-mode');
      const dragText = document.getElementById('drag-mode-text');
      if (filterState.mode === 'manual' || isManualDragActive) {
        dragBtn.className = 'px-2.5 py-1 rounded border border-amber-600 bg-amber-500 text-white text-[11px] font-black transition flex items-center gap-1 shadow-xs';
        dragText.textContent = filterState.manualStartIdx >= 0 ? '자유 구간 설정됨' : '구간을 클릭/드래그 하세요';
        document.body.classList.add('manual-drag-mode');
      } else {
        dragBtn.className = 'px-2.5 py-1 rounded border border-amber-400 bg-amber-50 hover:bg-amber-100 text-amber-800 text-[11px] font-bold transition flex items-center gap-1 shadow-2xs';
        dragText.textContent = '구간 직접 드래그/선택';
        document.body.classList.remove('manual-drag-mode');
      }

      // 3) 각 칸의 활성화 여부 판정
      const isFilterOn = (filterState.mode === 'wcu' && filterState.selectedWcus.length > 0) ||
                         (filterState.mode === 'manual' && filterState.manualStartIdx >= 0 && filterState.manualEndIdx >= 0);

      document.querySelectorAll('[data-track-col]').forEach(col => {
        const colIdx = Number(col.dataset.linearIdx);
        const wcuAttr = col.dataset.wcuList;
        const colWcus = wcuAttr ? wcuAttr.split(',').map(Number) : [];

        let isSelected = false;

        if (!isFilterOn) {
          isSelected = true; // 아무것도 선택 안 했으면 전체 정상
        } else if (filterState.mode === 'manual') {
          const s = Math.min(filterState.manualStartIdx, filterState.manualEndIdx);
          const e = Math.max(filterState.manualStartIdx, filterState.manualEndIdx);
          isSelected = (colIdx >= s && colIdx <= e);
        } else {
          // WCU 모드
          isSelected = colWcus.some(w => filterState.selectedWcus.includes(w));
        }

        // 음영 적용
        if (isSelected) {
          col.classList.remove('wcu-dimmed');
        } else {
          col.classList.add('wcu-dimmed');
        }

        // 일반 본선 배너
        const normalBadge = col.querySelector('.normal-mainline-badge');
        if (normalBadge) {
          const textSpan = normalBadge.querySelector('.mainline-text');
          if (isFilterOn && isSelected && memo) {
            textSpan.textContent = memo;
            normalBadge.className = 'normal-mainline-badge station-mid-marker relative z-20 w-full h-[20px] rounded shadow-xs flex items-center justify-center px-1 border border-amber-600';
            normalBadge.style.cssText = 'background-color: #f59e0b !important; color: #ffffff !important; font-weight: 900 !important;';
            textSpan.style.cssText = 'color: #ffffff !important; font-weight: 900 !important; font-size: 9px !important;';
          } else {
            textSpan.textContent = '본선';
            normalBadge.className = 'normal-mainline-badge station-mid-marker relative z-20 w-full h-[20px] rounded bg-white/85 text-slate-400 font-bold border border-slate-300 shadow-xs flex items-center justify-center px-1';
            normalBadge.style.cssText = '';
            textSpan.style.cssText = '';
          }
        }

        // 경계 본선 배너
        const boundaryBadges = col.querySelectorAll('.boundary-edge-badge');
        boundaryBadges.forEach(bBadge => {
          const forWcu = Number(bBadge.dataset.forWcu);
          const defaultLabel = bBadge.dataset.defaultLabel;
          
          let showMemo = false;
          if (isFilterOn && memo) {
            if (filterState.mode === 'manual') {
              showMemo = isSelected;
            } else {
              showMemo = filterState.selectedWcus.includes(forWcu);
            }
          }

          if (showMemo) {
            bBadge.textContent = memo;
            bBadge.className = 'boundary-edge-badge px-1 py-0.5 rounded shadow-2xs border border-amber-600 truncate leading-none';
            bBadge.style.cssText = 'background-color: #f59e0b !important; color: #ffffff !important; font-weight: 900 !important; font-size: 8.5px !important;';
          } else {
            bBadge.textContent = defaultLabel;
            bBadge.className = 'boundary-edge-badge text-[8px] font-extrabold text-slate-600 select-none truncate leading-none';
            bBadge.style.cssText = '';
          }
        });
      });
    }

    /* ========================================================
       3. 트랙 렌더링 및 1차원 선로 등록
    ======================================================== */
    function registerLinearTrackCol(key) {
      const idx = linearTrackKeys.length;
      linearTrackKeys.push(key);
      return idx;
    }

    function renderTrackLine(containerId, list, isReverse = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      list.forEach((st, idx) => {
        const col = document.createElement('div');
        const isConn = st.isConnector;
        const colWidth = isConn ? 'flex-[0.75] max-w-[88px] min-w-[72px]' : 'flex-1 max-w-[104px] min-w-[84px]';
        
        const linearIdx = registerLinearTrackCol(st.id);

        col.className = `flex flex-col justify-between items-center h-[190px] px-0.5 z-10 transition-all duration-200 ${colWidth}`;
        col.setAttribute('data-track-col', 'true');
        col.setAttribute('data-linear-idx', String(linearIdx));
        col.setAttribute('data-col-id', st.id);
        col.setAttribute('data-wcu-list', String(st.wcu));
        
        let rowClass = `row${st.tier}-style`;
        let dotColor = st.tier === 1 ? '#059669' : (st.tier === 2 ? '#d97706' : '#7c3aed');
        let badgeStyle = `bg-white text-slate-900 border-2 ${rowClass}`;

        if (st.isDepot) {
          badgeStyle = 'depot-badge border-2';
          dotColor = '#d97706';
        } else if (isConn) {
          badgeStyle = 'bg-white/85 text-slate-400 border border-dashed border-slate-300';
        }
        
        const upBg = isConn 
          ? 'bg-sky-50/40 border border-dashed border-sky-200' 
          : (st.isDepot ? 'bg-amber-50/50 border border-amber-300' : 'bg-sky-50/80 border border-sky-200');
          
        const dnBg = isConn 
          ? 'bg-rose-50/40 border border-dashed border-rose-200' 
          : (st.isDepot ? 'bg-amber-50/50 border border-amber-300' : 'bg-rose-50/80 border border-rose-200');

        col.innerHTML = `
          <div class="station-dropzone w-full h-[76px] rounded-lg ${upBg} flex items-center justify-center p-0.5 shadow-2xs backdrop-blur-xs" data-location="${st.id}_UP" title="${st.name} 상선"></div>
          
          <div class="station-mid-marker relative z-20 w-full h-[20px] rounded ${badgeStyle} flex items-center justify-center shadow-xs px-1 gap-1" data-marker="${st.id}">
            ${st.num ? `<span class="w-3 h-3 rounded-full text-white text-[7px] font-black flex items-center justify-center shadow-xs" style="background-color: ${dotColor};">${st.num}</span>` : ''}
            <span class="${isConn ? 'text-[8.5px] font-bold text-slate-400' : 'text-[9.5px] font-bold'} truncate leading-none">${st.name}</span>
            ${st.transfer ? `<span class="text-[7.5px] bg-sky-100 text-sky-800 font-bold px-0.5 rounded leading-tight">${st.transfer}</span>` : ''}
          </div>

          <div class="station-dropzone w-full h-[76px] rounded-lg ${dnBg} flex items-center justify-center p-0.5 shadow-2xs backdrop-blur-xs" data-location="${st.id}_DN" title="${st.name} 하선"></div>
        `;
        container.appendChild(col);

        // 일반 역간 본선 칸
        if (idx < list.length - 1 && !isConn && !list[idx + 1].isConnector) {
          const nextSt = list[idx + 1];
          const secId = `SEC_${st.id}_${nextSt.id}`;
          const edgeLabels = getWcuEdgeLabels(st.id, nextSt.id);
          const singleWcu = getSectionWcu(st, nextSt);

          const secLinearIdx = registerLinearTrackCol(secId);

          const sec = document.createElement('div');
          sec.className = 'relative flex flex-col justify-between items-center h-[190px] flex-[0.75] px-0.5 z-10 max-w-[88px] min-w-[72px] transition-all duration-200';
          sec.setAttribute('data-track-col', 'true');
          sec.setAttribute('data-linear-idx', String(secLinearIdx));
          sec.setAttribute('data-col-id', secId);
          
          if (edgeLabels) {
            sec.setAttribute('data-wcu-list', edgeLabels.boundary.join(','));
          } else {
            sec.setAttribute('data-wcu-list', String(singleWcu));
          }
          
          const markerContent = edgeLabels
            ? `<div class="station-mid-marker relative z-20 w-full h-[20px] rounded bg-white/80 border border-slate-300 flex items-center justify-between px-1 shadow-xs backdrop-blur-xs" data-marker="${secId}">
                 <span class="boundary-edge-badge text-[8px] font-extrabold text-slate-600 select-none truncate leading-none" data-for-wcu="${edgeLabels.leftWcu}" data-default-label="${edgeLabels.left}">${edgeLabels.left}</span>
                 <span class="boundary-edge-badge text-[8px] font-extrabold text-slate-600 select-none truncate leading-none" data-for-wcu="${edgeLabels.rightWcu}" data-default-label="${edgeLabels.right}">${edgeLabels.right}</span>
               </div>`
            : `<div class="normal-mainline-badge station-mid-marker relative z-20 w-full h-[20px] rounded bg-white/85 border border-slate-300 flex items-center justify-center shadow-xs px-1 text-slate-400 font-bold text-[8.5px]" data-marker="${secId}" data-for-wcu="${singleWcu}">
                 <span class="mainline-text text-[8.5px] font-bold text-slate-400 truncate">본선</span>
               </div>`;

          sec.innerHTML = `
            ${edgeLabels ? '<div class="wcu-boundary-line" title="WCU 경계 분할선"></div>' : ''}
            <div class="station-dropzone w-full h-[76px] rounded-lg bg-sky-50/40 border border-dashed border-sky-200 flex items-center justify-center p-0.5 shadow-2xs" data-location="${secId}_UP" title="${st.name}~${nextSt.name} 본선 상선"></div>
            ${markerContent}
            <div class="station-dropzone w-full h-[76px] rounded-lg bg-rose-50/40 border border-dashed border-rose-200 flex items-center justify-center p-0.5 shadow-2xs" data-location="${secId}_DN" title="${st.name}~${nextSt.name} 본선 하선"></div>
          `;
          container.appendChild(sec);
        }
      });
    }

    /* ========================================================
       4. 수동 구간 드래그 & 클릭 선택 이벤트 리스너
    ======================================================== */
    function attachManualRangeEvents() {
      const captureArea = document.getElementById('capture-area');

      // 마우스/터치 다운
      captureArea.addEventListener('pointerdown', (e) => {
        const col = e.target.closest('[data-track-col]');
        // 열차 카드를 끄는 중이거나 모드가 꺼져있을 땐 드래그 모드 무시
        if (!col || e.target.closest('.train-card') || (!isManualDragActive && filterState.mode !== 'manual')) return;

        const idx = Number(col.dataset.linearIdx);
        if (isNaN(idx)) return;

        isPointerDragging = true;
        dragAnchorIdx = idx;

        // 시작점 설정
        filterState.mode = 'manual';
        filterState.manualStartIdx = idx;
        filterState.manualEndIdx = idx;
        updateFilterUI();
      });

      // 마우스/터치 이동 (드래그하여 원하는 만큼 늘림)
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDragging || dragAnchorIdx === null) return;
        const elem = document.elementFromPoint(e.clientX, e.clientY);
        const col = elem ? elem.closest('[data-track-col]') : null;
        if (!col) return;

        const currentIdx = Number(col.dataset.linearIdx);
        if (!isNaN(currentIdx) && currentIdx !== filterState.manualEndIdx) {
          filterState.manualEndIdx = currentIdx;
          updateFilterUI();
        }
      });

      // 마우스/터치 업 (범위 확정 및 클라우드 저장)
      window.addEventListener('pointerup', () => {
        if (isPointerDragging) {
          isPointerDragging = false;
          dragAnchorIdx = null;
          syncFilterToCloud();
          showToast('선택한 구간이 실시간 반영되었습니다.');
        }
      });
    }

    /* ========================================================
       5. 물리적 직결 'ㄹ'자 SVG 단일 궤도
    ======================================================== */
    function drawContinuousRail() {
      const captureArea = document.getElementById('capture-area');
      const captureRect = captureArea.getBoundingClientRect();

      const r1StartMarker = document.querySelector('[data-marker="st_yard"]');
      const r1ConnMarker = document.querySelector('[data-marker="sec_06_07"]');

      const r2DaejeMarker = document.querySelector('[data-marker="st_07"]');
      const r2ConnMarker = document.querySelector('[data-marker="sec_14_15"]');

      const r3StartMarker = document.querySelector('[data-marker="st_15"]');
      const r3EndMarker = document.querySelector('[data-marker="st_depot"]');

      if (!r1StartMarker || !r1ConnMarker || !r2ConnMarker || !r2DaejeMarker || !r3StartMarker || !r3EndMarker) return;

      const getCenter = (el) => {
        const r = el.getBoundingClientRect();
        return {
          x: (r.left + r.width / 2 - captureRect.left) / currentScale,
          y: (r.top + r.height / 2 - captureRect.top) / currentScale
        };
      };

      const pR1Start = getCenter(r1StartMarker);
      const pR1Conn = getCenter(r1ConnMarker);
      const pR2Daeje = getCenter(r2DaejeMarker);
      const pR2Conn = getCenter(r2ConnMarker);
      const pR3Start = getCenter(r3StartMarker);
      const pR3End = getCenter(r3EndMarker);

      const rightCurveX = Math.max(pR1Conn.x, pR2Daeje.x) + 48;
      const leftCurveX = Math.min(pR2Conn.x, pR3Start.x) - 48;

      const fullPath = `
        M ${pR1Start.x - 12} ${pR1Start.y}
        L ${pR1Conn.x} ${pR1Conn.y}
        C ${rightCurveX} ${pR1Conn.y}, ${rightCurveX} ${pR2Daeje.y}, ${pR2Daeje.x} ${pR2Daeje.y}
        L ${pR2Conn.x} ${pR2Conn.y}
        C ${leftCurveX} ${pR2Conn.y}, ${leftCurveX} ${pR3Start.y}, ${pR3Start.x} ${pR3Start.y}
        L ${pR3End.x + 12} ${pR3End.y}
      `;

      document.getElementById('svg-rail-ties').setAttribute('d', fullPath);
      document.getElementById('svg-rail-outer').setAttribute('d', fullPath);
      
      document.getElementById('svg-rail-row1').setAttribute('d', `M ${pR1Start.x - 12} ${pR1Start.y} L ${pR1Conn.x} ${pR1Conn.y}`);
      document.getElementById('svg-rail-curve1').setAttribute('d', `M ${pR1Conn.x} ${pR1Conn.y} C ${rightCurveX} ${pR1Conn.y}, ${rightCurveX} ${pR2Daeje.y}, ${pR2Daeje.x} ${pR2Daeje.y}`);
      document.getElementById('svg-rail-row2').setAttribute('d', `M ${pR2Daeje.x} ${pR2Daeje.y} L ${pR2Conn.x} ${pR2Conn.y}`);
      document.getElementById('svg-rail-curve2').setAttribute('d', `M ${pR2Conn.x} ${pR2Conn.y} C ${leftCurveX} ${pR2Conn.y}, ${leftCurveX} ${pR3Start.y}, ${pR3Start.x} ${pR3Start.y}`);
      document.getElementById('svg-rail-row3').setAttribute('d', `M ${pR3Start.x} ${pR3Start.y} L ${pR3End.x + 12} ${pR3End.y}`);
    }

    /* ========================================================
       6. 열차 렌더링 및 드래그 앤 드롭
    ======================================================== */
    function createTrainCardHTML(train) {
      return `
        <div id="${train.id}" 
             class="train-card flex flex-col bg-white border border-slate-300 rounded shadow-xs overflow-hidden select-none"
             draggable="true">
          
          <div class="bg-gradient-to-r from-[#7a2665] via-[#8c2670] to-[#7a2665] px-1 py-0.5 flex items-center justify-center text-white border-b border-purple-900 pointer-events-none">
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-train-subway text-[10px] text-purple-200"></i>
              <span class="text-[12px] font-semibold tracking-tight text-white leading-none">${train.numStr}</span>
            </div>
          </div>

          <div class="bg-slate-100 px-1 py-0.5 border-b border-slate-200 flex items-center justify-center pointer-events-none">
            <div class="flex gap-1 items-center">
              <div class="w-2 h-1 bg-slate-700 rounded-xs"></div>
              <div class="w-3.5 h-1 bg-sky-200 border border-slate-400 rounded-xs"></div>
              <div class="w-3.5 h-1 bg-sky-200 border border-slate-400 rounded-xs"></div>
              <div class="w-2 h-1 bg-slate-700 rounded-xs"></div>
            </div>
          </div>

          <div class="p-0.5 bg-white">
            <input type="text" 
                   value="${escapeHtml(train.label)}" 
                   placeholder="이름" 
                   class="train-label-input w-full text-center text-[10px] font-semibold px-1 py-0.5 bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 focus:border-purple-600 rounded text-slate-800 focus:outline-hidden transition leading-tight"
                   data-train-id="${train.id}" />
          </div>
        </div>
      `;
    }

    function renderAllTrains() {
      const activeInput = document.activeElement;
      const activeTrainId = activeInput && activeInput.classList.contains('train-label-input') 
                            ? activeInput.dataset.trainId : null;

      document.querySelectorAll('.station-dropzone').forEach(zone => {
        zone.querySelectorAll('.train-card').forEach(c => c.remove());
      });

      let dockCount = 0;

      Object.values(trainsData).forEach(train => {
        const targetZone = document.querySelector(`.station-dropzone[data-location="${train.location}"]`) 
                           || document.getElementById('train-dock');

        if (train.location === 'dock') {
          dockCount++;
        }

        const tempWrap = document.createElement('div');
        tempWrap.innerHTML = createTrainCardHTML(train);
        const cardElem = tempWrap.firstElementChild;
        targetZone.appendChild(cardElem);
      });

      const countLabel = document.getElementById('depot-count');
      if (countLabel) countLabel.textContent = `${dockCount}편성 대기중`;

      if (activeTrainId) {
        const restoredInput = document.querySelector(`input[data-train-id="${activeTrainId}"]`);
        if (restoredInput) restoredInput.focus();
      }

      attachTrainEvents();
    }

    let currentScale = 1.0;
    const zoomWrapper = document.getElementById('zoom-wrapper');
    const scrollContainer = document.getElementById('scroll-container');
    const zoomText = document.getElementById('zoom-text');

    function setScale(scale) {
      currentScale = Math.min(Math.max(scale, 0.5), 2.5);
      zoomWrapper.style.transform = `scale(${currentScale})`;
      zoomText.textContent = `${Math.round(currentScale * 100)}%`;
      drawContinuousRail();
    }

    document.getElementById('btn-zoom-reset').addEventListener('click', () => { setScale(1.0); });

    function attachTrainEvents() {
      document.querySelectorAll('.train-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', card.id);
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.station-dropzone').forEach(z => z.classList.remove('drag-over'));
        });
      });

      document.querySelectorAll('.train-label-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const tId = e.target.dataset.trainId;
          if (trainsData[tId]) {
            trainsData[tId].label = e.target.value.trim();
            syncToCloud();
            showToast('편성 정보가 실시간 업데이트되었습니다.');
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') e.target.blur();
        });
      });
    }

    function initDropZones() {
      document.querySelectorAll('.station-dropzone').forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          zone.classList.add('drag-over');
        });

        zone.addEventListener('dragleave', (e) => {
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove('drag-over');
          }
        });

        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');

          const trainId = e.dataTransfer.getData('text/plain');
          if (trainId && trainsData[trainId]) {
            trainsData[trainId].location = zone.dataset.location;
            syncToCloud();
            showToast('실시간 위치가 공유되었습니다.');
          }
        });
      });
    }

    /* ========================================================
       7. 상단 헤더 컨트롤러 이벤트
    ======================================================== */
    // WCU 프리셋 버튼 클릭
    document.querySelectorAll('.wcu-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const num = Number(btn.dataset.wcu);
        filterState.mode = 'wcu';
        isManualDragActive = false;

        const idx = filterState.selectedWcus.indexOf(num);
        if (idx > -1) {
          filterState.selectedWcus.splice(idx, 1);
        } else {
          filterState.selectedWcus.push(num);
          filterState.selectedWcus.sort((a, b) => a - b);
        }
        syncFilterToCloud();
        updateFilterUI();
      });
    });

    // 전체 해제 버튼
    document.getElementById('btn-wcu-clear').addEventListener('click', () => {
      filterState.mode = 'wcu';
      filterState.selectedWcus = [];
      filterState.manualStartIdx = -1;
      filterState.manualEndIdx = -1;
      filterState.memo = '';
      isManualDragActive = false;
      syncFilterToCloud();
      updateFilterUI();
      showToast('구간 선택 및 문구가 전체 해제되었습니다.');
    });

    // 수동 드래그 모드 토글 버튼
    document.getElementById('btn-toggle-drag-mode').addEventListener('click', () => {
      isManualDragActive = !isManualDragActive;
      if (isManualDragActive) {
        filterState.mode = 'manual';
        showToast('노선 위의 시작역과 끝역을 드래그하거나 클릭하세요.');
      }
      updateFilterUI();
    });

    // 문구 적용 버튼
    document.getElementById('btn-wcu-apply-text').addEventListener('click', () => {
      const input = document.getElementById('wcu-memo-input');
      filterState.memo = input.value.trim();
      syncFilterToCloud();
      updateFilterUI();
      showToast('구간 표기문구가 실시간 반영되었습니다.');
    });

    document.getElementById('wcu-memo-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-wcu-apply-text').click();
    });

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgSpan = document.getElementById('toast-message');
      msgSpan.textContent = msg;

      if (toastTimeout) clearTimeout(toastTimeout);
      toast.classList.add('show');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    document.getElementById('btn-return-all').addEventListener('click', () => {
      if (confirm('모든 편성을 대기소로 복귀시키겠습니까?\n(접속된 모든 기기에서 즉시 복귀됩니다)')) {
        Object.keys(trainsData).forEach(id => { trainsData[id].location = 'dock'; });
        syncToCloud();
        showToast('전체 편성이 대기소로 복귀되었습니다.');
      }
    });

    document.getElementById('btn-reset-names').addEventListener('click', () => {
      if (confirm('모든 열차에 작성된 메모/이름을 초기화하시겠습니까?\n(접속된 모든 기기에 반영됩니다)')) {
        Object.keys(trainsData).forEach(id => { trainsData[id].label = ''; });
        syncToCloud();
        showToast('텍스트가 초기화되었습니다.');
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* 초기 실행 */
    window.addEventListener('DOMContentLoaded', () => {
      renderTrackLine('track-tier-1', tier1Stations);
      renderTrackLine('track-tier-2', tier2Stations);
      renderTrackLine('track-tier-3', tier3Stations);
      
      initDropZones();
      attachManualRangeEvents();
      initRealtimeSync();

      setTimeout(drawContinuousRail, 200);
    });

    window.addEventListener('resize', drawContinuousRail);
  </script>
</body>
</html>
