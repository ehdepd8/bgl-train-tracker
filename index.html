<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산김해경전철 열차 종합 운용 현황판 (관리역별 색상 구분)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* 관리역별 테마 클래스 */
    .zone-sasang { border-color: #059669 !important; color: #065f46 !important; }
    .zone-daeje { border-color: #d97706 !important; color: #92400e !important; }
    .zone-gimhae { border-color: #0284c7 !important; color: #075985 !important; }
    .zone-gayadae { border-color: #9333ea !important; color: #6b21a8 !important; }

    /* 열차 카드 (94px 슬림 규격) */
    .train-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: grab;
      width: 94px;
      flex-shrink: 0;
      z-index: 30;
    }
    .train-card:active {
      cursor: grabbing;
      transform: scale(0.96);
    }
    .train-card.dragging {
      opacity: 0.45;
      transform: scale(1.05);
    }

    /* 드롭존 하이라이트 */
    .station-dropzone.drag-over {
      background-color: #fdf2f8 !important;
      border-color: #db2777 !important;
      transform: scale(1.02);
      box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.35);
    }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      border: 1px solid #334155;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col p-3">

  <!-- 토스트 알림 -->
  <div id="toast">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">저장되었습니다.</span>
  </div>

  <!-- 상단 컨트롤 헤더 -->
  <header class="bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-xs flex flex-wrap items-center justify-between gap-3 sticky top-1 z-50 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#832569] to-[#b8328f] flex items-center justify-center text-white shadow-xs">
        <i class="fa-solid fa-train-subway text-sm"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold text-slate-900 tracking-tight">부산김해경전철 열차 종합 운용 현황판</h1>
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-800">1~25편성 관제</span>
        </div>
      </div>
      
      <!-- 관리역 범례 가이드 -->
      <div class="flex items-center gap-3 text-[11px] font-bold border-l border-slate-200 pl-3">
        <span class="flex items-center gap-1 text-emerald-700"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>사상구간</span>
        <span class="flex items-center gap-1 text-amber-700"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>대저구간</span>
        <span class="flex items-center gap-1 text-sky-700"><span class="w-2.5 h-2.5 rounded-full bg-sky-600"></span>인제대/김해구간</span>
        <span class="flex items-center gap-1 text-purple-700"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>가야대/기지구간</span>
      </div>
    </div>

    <!-- 기능 버튼 -->
    <div class="flex items-center gap-1.5 text-xs">
      <button id="btn-save" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md font-medium shadow-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-floppy-disk text-[11px]"></i> 상태 저장
      </button>
      <button id="btn-return-all" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-md font-medium shadow-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-warehouse text-[11px]"></i> 대기소 복귀
      </button>
      <button id="btn-reset-names" class="px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md font-medium transition flex items-center gap-1">
        <i class="fa-solid fa-rotate-left text-[11px]"></i> 텍스트 초기화
      </button>
      <div class="h-5 w-px bg-slate-200 mx-1"></div>
      <button id="btn-export-slide" class="px-3 py-1.5 bg-[#832569] hover:bg-[#6c1c54] text-white rounded-md font-semibold shadow-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-image text-[11px]"></i> 슬라이드용 PNG 저장
      </button>
    </div>
  </header>

  <!-- 1. 열차 대기소 -->
  <section class="bg-white rounded-xl p-3 shadow-xs border border-slate-200 mb-3">
    <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <h2 class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-cubes-stacked text-purple-700"></i>
          편성 대기소 (1편성 ~ 25편성)
        </h2>
        <span id="depot-count" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-semibold">25편성 대기중</span>
      </div>
      <div class="text-[11px] text-slate-400">
        💡 열차를 원하는 역 또는 본선의 상선/하선으로 드래그하세요.
      </div>
    </div>

    <!-- 대기소 드롭존 -->
    <div id="train-dock" class="station-dropzone min-h-[92px] p-2 rounded-lg bg-slate-50 border-2 border-dashed border-slate-300 flex flex-wrap gap-1.5 items-start justify-start" data-location="dock"></div>
  </section>

  <!-- 2. 메인 단일 연속 'ㄹ'자 궤도망 영역 -->
  <main class="bg-white rounded-xl p-4 shadow-xs border border-slate-200 flex flex-col relative w-full overflow-hidden" id="capture-area">
    
    <!-- SVG 완전 단일 연속 레일 궤도 (관리역 구간별 다색 그라디언트) -->
    <svg id="continuous-rail-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0">
      <defs>
        <!-- 관리역별 연속 그라디언트 선로 색상 -->
        <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#059669" />    <!-- 사상 권역 (에메랄드 그린) -->
          <stop offset="35%" stop-color="#d97706" />   <!-- 대저 권역 (골드 오렌지) -->
          <stop offset="68%" stop-color="#0284c7" />   <!-- 인제대/김해 권역 (스카이 블루) -->
          <stop offset="100%" stop-color="#9333ea" />  <!-- 가야대/기지 권역 (퍼플 마젠타) -->
        </linearGradient>
      </defs>

      <!-- 침목 -->
      <path id="svg-rail-ties" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linecap="round" stroke-dasharray="3, 11" opacity="0.65" />
      <!-- 주 레일 외곽선 -->
      <path id="svg-rail-outer" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />
      <!-- 주 레일 코어 라인 (구간별 멀티 컬러) -->
      <path id="svg-rail-core" fill="none" stroke="url(#railGrad)" stroke-width="8" stroke-linecap="round" />
    </svg>

    <!-- [1행: 정방향 좌->우] 사상 권역 ➔ 등구~대저 본선 -->
    <div class="relative z-10 flex items-center mb-6" id="row-1">
      <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1">
        <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
        <span class="text-[9px] font-bold text-slate-400">선로</span>
        <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
      </div>
      <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-1"></div>
    </div>

    <!-- [2행: 역방향 우->좌] 시청~부원 본선 ➔ 김해/대저 권역 -->
    <div class="relative z-10 flex items-center mb-6" id="row-2">
      <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1">
        <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
        <span class="text-[9px] font-bold text-slate-400">선로</span>
        <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
      </div>
      <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-2"></div>
    </div>

    <!-- [3행: 정방향 좌->우] 김해/가야대 권역 ~ 신명기지 -->
    <div class="relative z-10 flex items-center pb-1" id="row-3">
      <div class="flex flex-col justify-between items-center h-[190px] w-[30px] shrink-0 mr-1.5 py-1">
        <span class="text-[10px] font-black text-sky-700 bg-sky-100 border border-sky-300 rounded px-1 py-0.5 shadow-2xs">상</span>
        <span class="text-[9px] font-bold text-slate-400">선로</span>
        <span class="text-[10px] font-black text-rose-700 bg-rose-100 border border-rose-300 rounded px-1 py-0.5 shadow-2xs">하</span>
      </div>
      <div class="flex flex-1 items-center justify-between gap-1" id="track-tier-3"></div>
    </div>

  </main>

  <script>
    /* ========================================================
       1. 노선 데이터 정의 (역명 축약 및 관리역 구역 설정)
       - zone: sasang(녹색), daeje(황색), gimhae(청색), gayadae(자색)
    ======================================================== */
    
    // 1행: 사상 관리역 권역 (괘법, 서부산 축약 적용)
    const tier1Stations = [
      { id: 'st_yard', num: '주박', name: '사상주박', isDepot: true, zone: 'sasang' },
      { id: 'st_01', num: '01', name: '사상', transfer: '2호선', zone: 'sasang' },
      { id: 'st_02', num: '02', name: '괘법', zone: 'sasang' },
      { id: 'st_03', num: '03', name: '서부산', zone: 'sasang' },
      { id: 'st_04', num: '04', name: '공항', transfer: '공항', zone: 'sasang' },
      { id: 'st_05', num: '05', name: '덕두', zone: 'sasang' },
      { id: 'st_06', num: '06', name: '등구', zone: 'sasang' },
      { id: 'sec_06_07', name: '등구~대저', isConnector: true }
    ];

    // 2행: 김해/대저 권역
    const tier2Stations = [
      { id: 'sec_14_15', name: '시청~부원', isConnector: true },
      { id: 'st_14', num: '14', name: '김해시청', zone: 'gimhae' },
      { id: 'st_13', num: '13', name: '인제대', zone: 'gimhae' },
      { id: 'st_12', num: '12', name: '김해대학', zone: 'gimhae' },
      { id: 'st_11', num: '11', name: '지내', zone: 'daeje' },
      { id: 'st_10', num: '10', name: '불암', zone: 'daeje' },
      { id: 'st_09', num: '09', name: '대사', zone: 'daeje' },
      { id: 'st_08', num: '08', name: '평강', zone: 'daeje' },
      { id: 'st_07', num: '07', name: '대저', transfer: '3호선', zone: 'daeje' }
    ];

    // 3행: 김해/가야대 권역
    const tier3Stations = [
      { id: 'st_15', num: '15', name: '부원', zone: 'gimhae' },
      { id: 'st_16', num: '16', name: '봉황', zone: 'gimhae' },
      { id: 'st_17', num: '17', name: '수로왕릉', zone: 'gimhae' },
      { id: 'st_18', num: '18', name: '박물관', zone: 'gayadae' },
      { id: 'st_19', num: '19', name: '연지공원', zone: 'gayadae' },
      { id: 'st_20', num: '20', name: '장신대', zone: 'gayadae' },
      { id: 'st_21', num: '21', name: '가야대', zone: 'gayadae' },
      { id: 'st_depot', num: '기지', name: '신명기지', isDepot: true, zone: 'gayadae' }
    ];

    // 1~25편성 데이터
    let trainsData = {};
    for (let i = 1; i <= 25; i++) {
      const trainId = `train_${i}`;
      trainsData[trainId] = {
        id: trainId,
        num: i,
        numStr: String(i).padStart(2, '0') + '편성',
        label: '',
        location: 'dock'
      };
    }

    const STORAGE_KEY = 'BGL_TRAIN_TRACKER_STATE_REAL_S';
    function loadSavedData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          trainsData = { ...trainsData, ...parsed };
        }
      } catch (e) {
        console.error(e);
      }
    }

    function saveStateToStorageQuiet() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trainsData));
      } catch (e) {
        console.error(e);
      }
    }

    /* ========================================================
       2. UI 렌더링 템플릿
    ======================================================== */

    function createTrainCardHTML(train) {
      return `
        <div id="${train.id}" 
             class="train-card flex flex-col bg-white border border-slate-300 rounded shadow-xs overflow-hidden select-none"
             draggable="true">
          
          <div class="bg-gradient-to-r from-[#7a2665] via-[#942777] to-[#7a2665] px-1.5 py-0.5 flex items-center justify-center text-white border-b border-purple-900">
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-train-subway text-[9px] text-purple-200"></i>
              <span class="text-[10px] font-bold tracking-tight">${train.numStr}</span>
            </div>
          </div>

          <div class="bg-slate-100 px-1 py-0.5 border-b border-slate-200 flex items-center justify-center">
            <div class="flex gap-1 items-center">
              <div class="w-2 h-1 bg-slate-700 rounded-xs"></div>
              <div class="w-3.5 h-1 bg-sky-200 border border-slate-400 rounded-xs"></div>
              <div class="w-3.5 h-1 bg-sky-200 border border-slate-400 rounded-xs"></div>
              <div class="w-2 h-1 bg-slate-700 rounded-xs"></div>
            </div>
          </div>

          <div class="p-0.5 bg-white">
            <input type="text" 
                   value="${escapeHtml(train.label)}" 
                   placeholder="이름" 
                   class="train-label-input w-full text-center text-[10px] font-semibold px-1 py-0.5 bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 focus:border-purple-600 rounded text-slate-800 focus:outline-hidden transition leading-tight"
                   data-train-id="${train.id}" />
          </div>
        </div>
      `;
    }

    function renderTrackLine(containerId, list) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      list.forEach((st, idx) => {
        const col = document.createElement('div');
        const isConn = st.isConnector;

        const colWidth = isConn ? 'flex-[0.75] max-w-[88px] min-w-[72px]' : 'flex-1 max-w-[104px] min-w-[84px]';
        col.className = `flex flex-col justify-between items-center h-[190px] px-0.5 z-10 ${colWidth}`;
        
        // 관리역 구역별 뱃지 테두리/포인트 색상 설정
        let zoneClass = '';
        let dotColor = '#832569';
        if (st.zone === 'sasang') { zoneClass = 'zone-sasang'; dotColor = '#059669'; }
        else if (st.zone === 'daeje') { zoneClass = 'zone-daeje'; dotColor = '#d97706'; }
        else if (st.zone === 'gimhae') { zoneClass = 'zone-gimhae'; dotColor = '#0284c7'; }
        else if (st.zone === 'gayadae') { zoneClass = 'zone-gayadae'; dotColor = '#9333ea'; }

        const badgeStyle = isConn 
          ? 'bg-white/85 text-slate-400 border-slate-300' 
          : `bg-white text-slate-900 border-2 ${zoneClass}`;
        
        const upBg = isConn 
          ? 'bg-sky-50/40 border border-dashed border-sky-200' 
          : 'bg-sky-50/80 border border-sky-200';
          
        const dnBg = isConn 
          ? 'bg-rose-50/40 border border-dashed border-rose-200' 
          : 'bg-rose-50/80 border border-rose-200';

        col.innerHTML = `
          <!-- 상선 슬롯 -->
          <div class="station-dropzone w-full h-[76px] rounded-lg ${upBg} flex items-center justify-center p-0.5 shadow-2xs backdrop-blur-xs" data-location="${st.id}_UP" title="${st.name} 상선"></div>
          
          <!-- 슬림 명판 (관리역별 색상 테두리) -->
          <div class="station-mid-marker relative z-20 w-full h-[20px] rounded ${badgeStyle} flex items-center justify-center shadow-xs px-1 gap-1" data-marker="${st.id}">
            ${st.num ? `<span class="w-3 h-3 rounded-full text-white text-[7px] font-black flex items-center justify-center shadow-xs" style="background-color: ${dotColor};">${st.num}</span>` : ''}
            <span class="${isConn ? 'text-[8.5px] font-bold text-slate-400' : 'text-[9.5px] font-extrabold'} truncate leading-none">${st.name}</span>
            ${st.transfer ? `<span class="text-[7.5px] bg-sky-100 text-sky-800 font-bold px-0.5 rounded leading-tight">${st.transfer}</span>` : ''}
          </div>

          <!-- 하선 슬롯 -->
          <div class="station-dropzone w-full h-[76px] rounded-lg ${dnBg} flex items-center justify-center p-0.5 shadow-2xs backdrop-blur-xs" data-location="${st.id}_DN" title="${st.name} 하선"></div>
        `;
        container.appendChild(col);

        // 일반 역간 본선 구간
        if (idx < list.length - 1 && !isConn && !list[idx + 1].isConnector) {
          const nextSt = list[idx + 1];
          const sec = document.createElement('div');
          sec.className = 'flex flex-col justify-between items-center h-[190px] flex-[0.75] px-0.5 z-10 max-w-[88px] min-w-[72px]';
          sec.innerHTML = `
            <!-- 본선 상선 -->
            <div class="station-dropzone w-full h-[76px] rounded-lg bg-sky-50/40 border border-dashed border-sky-200 flex items-center justify-center p-0.5 shadow-2xs" data-location="SEC_${st.id}_${nextSt.id}_UP" title="${st.name}~${nextSt.name} 본선 상선"></div>
            
            <!-- 본선 표기 -->
            <div class="station-mid-marker relative z-20 w-full h-[20px] rounded bg-white/85 border border-slate-300 flex items-center justify-center shadow-xs" data-marker="SEC_${st.id}_${nextSt.id}">
              <span class="text-[8.5px] font-bold text-slate-400">본선</span>
            </div>

            <!-- 본선 하선 -->
            <div class="station-dropzone w-full h-[76px] rounded-lg bg-rose-50/40 border border-dashed border-rose-200 flex items-center justify-center p-0.5 shadow-2xs" data-location="SEC_${st.id}_${nextSt.id}_DN" title="${st.name}~${nextSt.name} 본선 하선"></div>
          `;
          container.appendChild(sec);
        }
      });
    }

    /* ========================================================
       3. 물리적 직결 'ㄹ'자 SVG 단일 궤도 정밀 계산
    ======================================================== */
    function drawContinuousRail() {
      const captureArea = document.getElementById('capture-area');
      const captureRect = captureArea.getBoundingClientRect();

      const r1StartMarker = document.querySelector('[data-marker="st_yard"]');
      const r1ConnMarker = document.querySelector('[data-marker="sec_06_07"]');

      const r2DaejeMarker = document.querySelector('[data-marker="st_07"]');
      const r2ConnMarker = document.querySelector('[data-marker="sec_14_15"]');

      const r3StartMarker = document.querySelector('[data-marker="st_15"]');
      const r3EndMarker = document.querySelector('[data-marker="st_depot"]');

      if (!r1StartMarker || !r1ConnMarker || !r2ConnMarker || !r2DaejeMarker || !r3StartMarker || !r3EndMarker) return;

      const getCenter = (el) => {
        const r = el.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - captureRect.left,
          y: r.top + r.height / 2 - captureRect.top
        };
      };

      const pR1Start = getCenter(r1StartMarker);
      const pR1Conn = getCenter(r1ConnMarker);
      const pR2Daeje = getCenter(r2DaejeMarker);
      const pR2Conn = getCenter(r2ConnMarker);
      const pR3Start = getCenter(r3StartMarker);
      const pR3End = getCenter(r3EndMarker);

      const rightCurveX = Math.max(pR1Conn.x, pR2Daeje.x) + 48;
      const leftCurveX = Math.min(pR2Conn.x, pR3Start.x) - 48;

      const pathD = `
        M ${pR1Start.x - 12} ${pR1Start.y}
        L ${pR1Conn.x} ${pR1Conn.y}
        C ${rightCurveX} ${pR1Conn.y}, ${rightCurveX} ${pR2Daeje.y}, ${pR2Daeje.x} ${pR2Daeje.y}
        L ${pR2Conn.x} ${pR2Conn.y}
        C ${leftCurveX} ${pR2Conn.y}, ${leftCurveX} ${pR3Start.y}, ${pR3Start.x} ${pR3Start.y}
        L ${pR3End.x + 12} ${pR3End.y}
      `;

      document.getElementById('svg-rail-ties').setAttribute('d', pathD);
      document.getElementById('svg-rail-outer').setAttribute('d', pathD);
      document.getElementById('svg-rail-core').setAttribute('d', pathD);
    }

    function renderAllTrains() {
      document.querySelectorAll('.station-dropzone').forEach(zone => {
        zone.querySelectorAll('.train-card').forEach(c => c.remove());
      });

      let dockCount = 0;

      Object.values(trainsData).forEach(train => {
        const targetZone = document.querySelector(`.station-dropzone[data-location="${train.location}"]`) 
                           || document.getElementById('train-dock');

        if (train.location === 'dock') {
          dockCount++;
        }

        const tempWrap = document.createElement('div');
        tempWrap.innerHTML = createTrainCardHTML(train);
        const cardElem = tempWrap.firstElementChild;
        targetZone.appendChild(cardElem);
      });

      const countLabel = document.getElementById('depot-count');
      if (countLabel) countLabel.textContent = `${dockCount}편성 대기중`;

      attachTrainEvents();
    }

    /* ========================================================
       4. 드래그 앤 드롭 및 이벤트 바인딩
    ======================================================== */
    let draggedTrainId = null;

    function attachTrainEvents() {
      document.querySelectorAll('.train-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          draggedTrainId = card.id;
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', card.id);
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedTrainId = null;
          document.querySelectorAll('.station-dropzone').forEach(z => z.classList.remove('drag-over'));
        });
      });

      document.querySelectorAll('.train-label-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const tId = e.target.dataset.trainId;
          if (trainsData[tId]) {
            trainsData[tId].label = e.target.value.trim();
            saveStateToStorageQuiet();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') e.target.blur();
        });
      });
    }

    function initDropZones() {
      document.querySelectorAll('.station-dropzone').forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          zone.classList.add('drag-over');
        });

        zone.addEventListener('dragleave', (e) => {
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove('drag-over');
          }
        });

        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');

          const trainId = e.dataTransfer.getData('text/plain') || draggedTrainId;
          if (trainId && trainsData[trainId]) {
            trainsData[trainId].location = zone.dataset.location;
            renderAllTrains();
            saveStateToStorageQuiet();
          }
        });
      });
    }

    /* ========================================================
       5. 상단 컨트롤 버튼 동작 및 토스트 팝업 제어
    ======================================================== */
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgSpan = document.getElementById('toast-message');
      msgSpan.textContent = msg;

      if (toastTimeout) clearTimeout(toastTimeout);
      toast.classList.add('show');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    document.getElementById('btn-save').addEventListener('click', () => {
      saveStateToStorageQuiet();
      showToast('편성 배치 및 상태가 저장되었습니다.');
    });

    document.getElementById('btn-return-all').addEventListener('click', () => {
      if (confirm('모든 편성을 대기소로 복귀시키겠습니까?')) {
        Object.keys(trainsData).forEach(id => { trainsData[id].location = 'dock'; });
        renderAllTrains();
        saveStateToStorageQuiet();
        showToast('전체 편성이 대기소로 복귀되었습니다.');
      }
    });

    document.getElementById('btn-reset-names').addEventListener('click', () => {
      if (confirm('모든 열차에 작성된 메모/이름을 초기화하시겠습니까?')) {
        Object.keys(trainsData).forEach(id => { trainsData[id].label = ''; });
        renderAllTrains();
        saveStateToStorageQuiet();
        showToast('텍스트가 초기화되었습니다.');
      }
    });

    // 슬라이드 삽입용 고화질 전체 캡처
    document.getElementById('btn-export-slide').addEventListener('click', async () => {
      const captureElem = document.getElementById('capture-area');
      const btn = document.getElementById('btn-export-slide');
      const originText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> 생성 중...';

      try {
        const canvas = await html2canvas(captureElem, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        });

        const link = document.createElement('a');
        link.download = `부산김해경전철_노선운용현황_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('슬라이드용 고화질 이미지가 다운로드되었습니다!');
      } catch (err) {
        console.error(err);
        alert('이미지 생성 중 오류가 발생했습니다.');
      } finally {
        btn.innerHTML = originText;
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* 초기 실행 */
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      renderTrackLine('track-tier-1', tier1Stations);
      renderTrackLine('track-tier-2', tier2Stations);
      renderTrackLine('track-tier-3', tier3Stations);
      initDropZones();
      renderAllTrains();

      setTimeout(drawContinuousRail, 200);
    });

    window.addEventListener('resize', drawContinuousRail);
  </script>
</body>
</html>
