<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산김해경전철 열차 운용 현황판 (단일 일체형 본선 노선)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* BGL 상징 와인/마젠타 */
    .bgl-primary { background-color: #832569; }
    .bgl-border { border-color: #832569; }
    .bgl-text { color: #832569; }

    /* 열차 카드 (124px 원형 규격) */
    .train-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: grab;
      width: 124px;
      flex-shrink: 0;
      z-index: 30;
    }
    .train-card:active {
      cursor: grabbing;
      transform: scale(0.96);
    }
    .train-card.dragging {
      opacity: 0.45;
      transform: scale(1.05);
    }

    /* 드롭존 하이라이트 */
    .station-dropzone.drag-over {
      background-color: #fdf2f8 !important;
      border-color: #db2777 !important;
      transform: scale(1.01);
      box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.35);
    }

    /* 하나의 긴 단일 레일 트랙 표현 */
    .track-rail-bg {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 12px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, #7e22ce, #9d174d, #7e22ce);
      border-radius: 6px;
      z-index: 1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .track-ties-bg {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 24px;
      transform: translateY(-50%);
      background-image: repeating-linear-gradient(90deg, #94a3b8 0, #94a3b8 4px, transparent 4px, transparent 20px);
      z-index: 0;
      opacity: 0.75;
    }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background-color: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      border: 1px solid #334155;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col p-4">

  <!-- 토스트 알림 -->
  <div id="toast">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">저장되었습니다.</span>
  </div>

  <!-- 상단 컨트롤 헤더 -->
  <header class="bg-white border border-slate-200 rounded-2xl px-5 py-3 shadow-sm flex flex-wrap items-center justify-between gap-4 sticky top-2 z-50 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#832569] to-[#b8328f] flex items-center justify-center text-white shadow-md">
        <i class="fa-solid fa-train-subway text-lg"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold text-slate-900 tracking-tight">부산김해경전철 열차 종합 운용 현황판</h1>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-800">단일 일체형 전 구간 선로</span>
        </div>
        <p class="text-xs text-slate-500">사상주박지부터 신명차량기지까지 단 하나의 직선 레일로 연결된 전체 본선망입니다.</p>
      </div>
    </div>

    <!-- 기능 버튼 -->
    <div class="flex items-center gap-2 text-xs">
      <button id="btn-save" class="px-3 py-2 bg-emerald
